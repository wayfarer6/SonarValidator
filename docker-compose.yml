# =============================================================================
# SonarValidator — Docker Compose 통합 스택
# =============================================================================
#
#   frontend (nginx)  ──/api/*──▶  backend (Spring Boot / Java 26)  ──▶  postgres
#
# 사용법
#   docker compose up -d --build        # 전체 기동
#   docker compose ps                   # 상태
#   docker compose logs -f backend      # 로그
#   docker compose down                 # 종료 (볼륨 유지)
#   docker compose down -v              # 종료 + DB 삭제
#
# ⚠️ 최초 1회는 JDK 26 베이스 이미지를 먼저 구워야 한다.
#    (backend 이미지가 그 베이스를 FROM 으로 쓰기 때문)
#      docker compose --profile bootstrap build
#    또는
#      ./docker/scripts/build-all.sh
# =============================================================================

# compose 프로젝트 이름. 컨테이너/네트워크/볼륨 이름 앞에 붙는다.
name: sonarvalidator

# -----------------------------------------------------------------------------
# 로그 로테이션 (모든 서비스 공통)
# -----------------------------------------------------------------------------
# 기본 json-file 드라이버는 로그를 무한히 쌓아 디스크를 채운다.
# 이 프로젝트는 텔레메트리 로그가 많아 특히 위험하다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ===========================================================================
  # 0) JDK 26 베이스 이미지 (빌드 전용)
  # ===========================================================================
  # 이 서비스는 "실행"되지 않는다. base 이미지를 굽기 위한 자리다.
  # profile 로 분리해 두어 `docker compose up` 이 컨테이너를 만들지 않는다.
  #
  #   docker compose --profile bootstrap build
  #
  base-image:
    profiles: ["bootstrap"]
    image: ${BASE_IMAGE:-sonar-validator/jdk26-base:26.0.2.1}
    build:
      context: ./docker/base
      dockerfile: Dockerfile
    # 이미지 빌드만 하고 컨테이너는 만들지 않도록 즉시 종료하는 명령을 둔다.
    # (profile 로 이미 up 대상에서 빠지지만, 명시적으로 한 번 더 방어)
    command: ["/bin/true"]
    restart: "no"

  # ===========================================================================
  # 1) PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: sonar-postgres
    restart: unless-stopped
    logging: *default-logging

    environment:
      # ⚠️ 이 세 값은 "컨테이너를 처음 만들 때"만 쓰인다.
      #    볼륨(postgres-data)이 이미 있으면 무시되므로, 값을 바꾸려면
      #    `docker compose down -v` 로 볼륨을 지우고 다시 올려야 한다.
      POSTGRES_DB: ${DB_NAME:-sonarvalidator}
      POSTGRES_USER: ${DB_USER:-sonarvalidator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sonarvalidator}
      # 컨테이너 내부 시간대. 백엔드가 Asia/Seoul 을 쓰므로 맞춘다.
      TZ: Asia/Seoul
      # 한글 데이터를 안전하게 저장한다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      # 스키마 생성 순서를 고정해 재현 가능한 덤프를 얻는다.
      PGOPTIONS: "-c search_path=public"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      # 백엔드가 붙기 전에 DB 가 쿼리를 받을 수 있어야 한다.
      # $$ 는 compose 가 변수를 먼저 치환하지 않도록 하는 이스케이프다.
      # (컨테이너 안에서 셸이 평가한다)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 첫 기동 시 initdb 에 20~30초가 걸린다.
      start_period: 40s

    ports:
      # 호스트(예: DBeaver/psql)에서 직접 붙기 위한 노출.
      #   psql -h localhost -p 5432 -U sonarvalidator -d sonarvalidator
      # 5432 가 이미 쓰이면 .env 에 DB_PORT=5433 처럼 바꿔서 쓴다.
      # ⚠️ 0.0.0.0 으로 열리므로 외부망에 노출된 랩 장비에서는
      #    방화벽을 확인하거나 "127.0.0.1:${DB_PORT:-5432}:5432" 로 좁힐 것.
      - "${DB_PORT:-5432}:5432"

    networks:
      - sonar-net

  # ===========================================================================
  # 2) Spring Boot 백엔드 (Java 26)
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        # docker/base 로 구운 이미지를 그대로 쓴다.
        BASE_IMAGE: ${BASE_IMAGE:-sonar-validator/jdk26-base:26.0.2.1}
        # 이미지 빌드 중 테스트는 기본적으로 건너뛴다.
        # (테스트는 호스트에서 ./mvnw test 로 돌리는 편이 빠르다)
        #   docker compose build --build-arg SKIP_TESTS=false backend
        SKIP_TESTS: ${SKIP_TESTS:-true}

    image: sonar-validator/backend:${IMAGE_TAG:-latest}
    container_name: sonar-backend
    restart: unless-stopped
    logging: *default-logging

    # 시크릿/설정은 .env 에서 온다. (.env.example 을 복사해 만든다)
    env_file:
      - .env

    environment:
      # ---------------------------------------------------------------------
      # DB 연결
      # ---------------------------------------------------------------------
      # application-postgres.yml 이 ${DB_HOST:localhost} 형태로 읽는다.
      # 컨테이너 이름이 아니라 "서비스 이름(postgres)" 을 쓴다.
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-sonarvalidator}
      DB_USER: ${DB_USER:-sonarvalidator}
      DB_PASSWORD: ${DB_PASSWORD:-sonarvalidator}

      # ---------------------------------------------------------------------
      # ⚠️ 스키마 생성 방식
      # ---------------------------------------------------------------------
      # application-postgres.yml 의 기본값은 validate 다. validate 는
      # "스키마가 이미 있고 엔티티와 일치"해야만 기동되므로, 빈 DB 로
      # 처음 띄우면 테이블이 없다고 실패한다.
      # 그래서 compose 에서는 update 로 엔티티에 맞춰 테이블을 만들게 한다.
      #
      # ⚠️ 운영에서는 이 값을 지우고 Flyway/Liquibase 로 스키마를 관리할 것.
      JPA_DDL_AUTO: update

      # ---------------------------------------------------------------------
      # 기본 관리자 계정 비밀번호 (최초 기동 시 1회만 사용)
      # ---------------------------------------------------------------------
      # 사용자가 하나도 없을 때만 계정을 만든다.
      # id 는 코드에 "admin" 으로 고정되어 있다.
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:-admin}

      # ---------------------------------------------------------------------
      # OPNsense API Secret 암호화 키 (AES-256-GCM, 32바이트 Base64)
      # ---------------------------------------------------------------------
      # ⚠️ 이 값을 바꾸면 기존에 저장된 Secret 을 복호화할 수 없다.
      #    운영에서는 반드시 고정된 값을 주입할 것.
      SONAR_SECRET_KEY: ${SONAR_SECRET_KEY:-}

      # ---------------------------------------------------------------------
      # CORS 허용 출처
      # ---------------------------------------------------------------------
      # 프론트가 nginx 를 통해 "같은 출처"로 API 를 호출하므로 CORS 는
      # 원칙적으로 필요 없다. 다만 호스트에서 Vite 개발 서버(5173)를
      # 띄워 붙일 때를 위해 열어 둔다.
      SONAR_CORS_ALLOWED_ORIGINS: ${SONAR_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

      # 컨테이너 메모리에 맞춰 힙을 잡는다.
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul}

    ports:
      # C++ Prober 가 기본적으로 3000 을 본다
      # (SonarValidator_Prober/Installer/default.conf 의 SERVER_PORT=3000).
      # nginx 를 경유해도 되지만, 랩 장치를 그대로 두려면 직접 노출이 편하다.
      - "${BACKEND_PORT:-3000}:3000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      # Actuator health 는 SecurityConfig 에서 permitAll 이다.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # JPA/Hibernate 초기화 + 관리자 계정 생성에 시간이 걸린다.
      start_period: 90s

    networks:
      - sonar-net

  # ===========================================================================
  # 3) React 프론트엔드 (nginx)
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        # ⚠️ VITE_* 는 빌드 시점에 코드로 치환된다.
        #    빈 값이면 프론트가 상대 경로(/api/v1/...)로 호출하고,
        #    nginx 가 backend:3000 으로 프록시한다. (CORS 불필요)
        #    절대 URL 을 넣으면 그 주소가 JS 에 박히고, 백엔드의
        #    SONAR_CORS_ALLOWED_ORIGINS 에 프론트 출처를 넣어야 한다.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}

    image: sonar-validator/frontend:${IMAGE_TAG:-latest}
    container_name: sonar-frontend
    restart: unless-stopped
    logging: *default-logging

    ports:
      - "${FRONTEND_PORT:-80}:80"

    depends_on:
      # 백엔드가 살아난 뒤에 뜬다. 그렇지 않으면 첫 접속이 502 가 된다.
      backend:
        condition: service_healthy

    healthcheck:
      # nginx:alpine 에는 curl 이 없고 busybox wget 이 있다.
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - sonar-net

# =============================================================================
# 네트워크 / 볼륨
# =============================================================================
networks:
  sonar-net:
    driver: bridge

volumes:
  # ⚠️ `docker compose down -v` 하면 이 볼륨이 삭제되어 DB 데이터가 사라진다.
  postgres-data:
    name: sonarvalidator-postgres-data
