name: Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: type check + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SonarValidator_Frontend/package-lock.json

      - name: Install dependencies
        working-directory: SonarValidator_Frontend
        run: npm ci

      - name: Type check
        working-directory: SonarValidator_Frontend
        run: npx tsc -b

      - name: Lint
        working-directory: SonarValidator_Frontend
        run: npm run lint

      - name: Production build
        working-directory: SonarValidator_Frontend
        run: npm run build

      - name: Bundle size summary
        if: always()
        working-directory: SonarValidator_Frontend
        run: |
          if [ -d dist ]; then
            echo "### Frontend 빌드 산출물" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| 파일 | 크기 |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            du -h dist/assets/* 2>/dev/null | sort -h | tail -10 \
              | awk '{printf "| `%s` | %s |\n", $2, $1}' >> "$GITHUB_STEP_SUMMARY"
          fi
