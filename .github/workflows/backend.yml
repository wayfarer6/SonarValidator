name: Backend

# Java(Spring Boot) 백엔드의 컴파일과 테스트를 검증합니다.
#
# ⚠️ 왜 경로 필터를 쓰는가
#   이 저장소는 3계층(Backend / Frontend / Prober)이 한 저장소에 있습니다.
#   필터가 없으면 프론트엔드 문서 한 줄을 고쳐도 Java 빌드가 돌아
#   CI 대기 시간만 늘고, 정작 어느 계층이 깨졌는지 흐려집니다.

on:
  push:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# 같은 브랜치에서 새 커밋이 오면 이전 실행을 취소합니다.
# 남겨 두면 오래된 커밋의 실패가 최신 상태를 가립니다.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: compile + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ 이 프로젝트는 Java 26 이 필요합니다.
      #   pom.xml 의 <java.version>26</java.version> 이 그대로 반영되어
      #   컴파일 산출물이 major version 70 입니다. 21 로 낮추면
      #   "class file version 70.0" 으로 즉시 실패합니다.
      #   (Java 26 은 아직 LTS 가 아니지만 Adoptium 에 배포되어 있습니다)
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # ⚠️ `mvnw` 를 씁니다 (시스템 maven 이 아니라).
      #   저장소에 커밋된 래퍼가 Maven 버전을 고정하므로,
      #   러너 이미지의 Maven 이 바뀌어도 빌드가 흔들리지 않습니다.
      #
      # ⚠️ `-o` (오프라인) 를 쓰지 않습니다. 로컬에서는 캐시가 있어 빠르지만,
      #   CI 는 캐시가 비어 있어 의존성을 받아야 합니다.
      #   (`cache: maven` 이 ~/.m2 를 복원하므로 두 번째 실행부터 빨라집니다)
      #
      # ⚠️ `clean` 을 씁니다.
      #   증분 빌드는 이전 산출물이 남아 "있어야 할 클래스가 없다"
      #   (NoClassDefFoundError) 를 만들 수 있습니다. 로컬에서 실제로 겪었습니다.
      - name: Run tests
        working-directory: SonarValidator_Backend
        run: ./mvnw -B clean test

      # 테스트가 실패했을 때 원인을 볼 수 있게 리포트를 남깁니다.
      # (러너가 사라지면 로그만 남고 XML 은 사라집니다)
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: SonarValidator_Backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        run: |
          # 요약 한 줄만 남깁니다. 전체 XML 을 붙이면 로그가 읽히지 않습니다.
          if [ -d SonarValidator_Backend/target/surefire-reports ]; then
            total=$(grep -ho 'tests="[0-9]*"' SonarValidator_Backend/target/surefire-reports/*.xml 2>/dev/null \
              | grep -o '[0-9]*' | paste -sd+ - | bc 2>/dev/null || echo 0)
            failures=$(grep -ho 'failures="[0-9]*"' SonarValidator_Backend/target/surefire-reports/*.xml 2>/dev/null \
              | grep -o '[0-9]*' | paste -sd+ - | bc 2>/dev/null || echo 0)
            errors=$(grep -ho 'errors="[0-9]*"' SonarValidator_Backend/target/surefire-reports/*.xml 2>/dev/null \
              | grep -o '[0-9]*' | paste -sd+ - | bc 2>/dev/null || echo 0)
            echo "### Backend 테스트 결과" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- 전체: **${total}**" >> "$GITHUB_STEP_SUMMARY"
            echo "- 실패: **${failures}** / 오류: **${errors}**" >> "$GITHUB_STEP_SUMMARY"
          fi