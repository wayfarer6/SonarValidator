name: Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: compile + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run tests
        working-directory: SonarValidator_Backend
        run: ./mvnw -B clean test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: SonarValidator_Backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        run: |
          if [ -d SonarValidator_Backend/target/surefire-reports ]; then
            total=$(grep -ho 'tests="[0-9]*"' SonarValidator_Backend/target/surefire-reports/*.xml 2>/dev/null \
              | grep -o '[0-9]*' | paste -sd+ - | bc 2>/dev/null || echo 0)
            failures=$(grep -ho 'failures="[0-9]*"' SonarValidator_Backend/target/surefire-reports/*.xml 2>/dev/null \
              | grep -o '[0-9]*' | paste -sd+ - | bc 2>/dev/null || echo 0)
            errors=$(grep -ho 'errors="[0-9]*"' SonarValidator_Backend/target/surefire-reports/*.xml 2>/dev/null \
              | grep -o '[0-9]*' | paste -sd+ - | bc 2>/dev/null || echo 0)
            echo "### Backend 테스트 결과" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- 전체: **${total}**" >> "$GITHUB_STEP_SUMMARY"
            echo "- 실패: **${failures}** / 오류: **${errors}**" >> "$GITHUB_STEP_SUMMARY"
          fi
