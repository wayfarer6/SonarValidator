name: Prober

on:
  push:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Prober/**'
      - 'tests/prober/**'
      - '.github/workflows/prober.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Prober/**'
      - 'tests/prober/**'
      - '.github/workflows/prober.yml'
  workflow_dispatch:

concurrency:
  group: prober-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CMake + CTest (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            static: 'OFF'
            linker: ''
          - mode: static
            static: 'ON'
            linker: '-static'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libsqlite3-dev libssl-dev \
            libboost-dev nlohmann-json3-dev
      - name: Guard ordinary builds against generator or Homebrew use
        run: |
          mkdir -p "$RUNNER_TEMP/sonar-tool-guards"
          for tool in brew java; do
            printf '#!/bin/sh\necho "%s" >> "%s"\nexit 95\n' "$tool" "$RUNNER_TEMP/sonar-tools-called" > "$RUNNER_TEMP/sonar-tool-guards/$tool"
            chmod +x "$RUNNER_TEMP/sonar-tool-guards/$tool"
          done
          echo "$RUNNER_TEMP/sonar-tool-guards" >> "$GITHUB_PATH"
          cmp SonarValidator_Prober/third_party/antlr4-runtime/LICENSE.txt \
            SonarValidator_Backend/src/main/resources/agent-licenses/antlr4-runtime-LICENSE.txt
      - name: Configure
        run: |
          cmake -S SonarValidator_Prober -B build-prober \
            -DCMAKE_BUILD_TYPE=Release \
            -DSONAR_STATIC_LINK=${{ matrix.static }} \
            '-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.linker }}'
      - name: Build
        run: |
          cmake --build build-prober --parallel 2
          test ! -e "$RUNNER_TEMP/sonar-tools-called"
      - name: Run complete regression suite
        run: ctest --test-dir build-prober --output-on-failure --no-tests=error --output-junit test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prober-tests-${{ matrix.mode }}
          path: build-prober/test-results.xml
