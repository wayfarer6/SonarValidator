name: Prober

# C++23 Prober(Agent) 의 빌드와 단위 테스트를 검증합니다.
#
# ⚠️ 이 워크플로가 가장 까다로운 이유 — 외부 의존 3가지
#   1. **ANTLR4 C++ 런타임 (4.13.2)** — 문법에서 생성한 파서가 커밋되어 있어
#      Java/jar 는 필요 없지만, 실행에 쓸 **정적 라이브러리와 헤더**는 필요합니다.
#      (find_package 가 아니라 ANTLR4_RUNTIME_ROOT 로 찾습니다)
#   2. **Boost (헤더 전용)** — Asio/Beast 로 WebSocket 통신을 합니다.
#      관리/텔레메트리 통신이 여기에 얹혀 있어 없으면 구성 단계에서 실패합니다.
#   3. **nlohmann_json** — 없으면 CMake 가 FetchContent 로 받습니다(인터넷 필요).
#      러너에 이미 있으므로 apt 로 명시 설치해 네트워크 의존을 줄입니다.
#
# ⚠️ ANTLR4 런타임을 왜 소스에서 직접 빌드하는가
#   Ubuntu 의 libantlr4-runtime-dev 는 버전이 맞지 않을 수 있고,
#   커밋된 생성 소스는 **4.13.2** 로 생성되어 있습니다. 버전이 어긋나면
#   컴파일은 되지만 런타임에 링크 오류/크래시가 납니다.
#   (로컬에서도 4.13.1 스냅샷 fork 를 쓰다 44개 파일이 뒤집힌 적이 있습니다)

on:
  push:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Prober/**'
      - '.github/workflows/prober.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'SonarValidator_Prober/**'
      - '.github/workflows/prober.yml'
  workflow_dispatch:

concurrency:
  group: prober-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 커밋된 생성 소스와 반드시 같아야 합니다. 올릴 때는
  # components/parser/cmake/regenerate_parser.sh 로 재생성 후 커밋하세요.
  ANTLR4_VERSION: '4.13.2'
  ANTLR4_RUNTIME_ROOT: ${{ github.workspace }}/.antlr4-install

jobs:
  build:
    name: cmake build + ctest
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ g++ 13 이상이 필요합니다 (C++23 의 일부 기능).
      #   ubuntu-latest 의 기본 g++ 이 충분히 최신이지만, apt 로 명시 설치해
      #   러너 이미지 변경에 흔들리지 않게 합니다.
      #
      # ⚠️ ninja 를 쓰지 않습니다. 실측으로 기본 생성기(Unix Makefiles)로
      #   ANTLR 런타임과 프로버 모두 정상 구성되는 것을 확인했습니다.
      #   생성기를 하나 더 늘리면 CI 에만 있는 변수가 생깁니다.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ cmake \
            libsqlite3-dev libssl-dev \
            libboost-dev nlohmann-json3-dev \
            curl unzip

      # ⚠️ 캐시 키에 ANTLR4_VERSION 을 넣습니다.
      #   버전을 올렸는데 캐시가 남아 있으면 옛 런타임으로 링크되어
      #   "CI 는 통과하는데 로컬과 다르게 동작" 하는 상태가 됩니다.
      - name: Cache ANTLR4 C++ runtime
        id: antlr-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANTLR4_RUNTIME_ROOT }}
          key: antlr4-cxx-runtime-${{ env.ANTLR4_VERSION }}-${{ runner.os }}

      # ⚠️ 소스에서 빌드합니다. jar 는 필요 없습니다 —
      #   생성 파서가 저장소에 커밋되어 있으므로 런타임만 있으면 됩니다.
      #
      # ⚠️ 압축 파일의 **루트가 곧 C++ 런타임**입니다.
      #   흔히 `runtime/Cpp` 를 기대하기 쉬운데, 이 zip 은 배포용으로
      #   최상위에 `runtime/`·`cmake/`·`CMakeLists.txt` 를 담고 있습니다.
      #   (실측: `antlr4-cpp-runtime-4.13.2-source.zip` 을 풀면
      #    최상위에 CMakeLists.txt 와 VERSION=4.13.2 가 바로 있습니다)
      #   그래서 `-d` 로 받은 디렉터리에서 바로 구성합니다.
      #
      # ⚠️ `ANTLR_BUILD_CPP_TESTS=OFF` 는 이 zip 에서 정의되지 않습니다
      #   (이 배포판의 CMakeLists 에 해당 option 이 없음). 넘겨도 경고만
      #   나고 무시되므로, 혼란을 줄이려 넣지 않습니다.
      #
      # ⚠️ 생성기를 지정하지 않습니다 (기본 Unix Makefiles).
      #   실측으로 이 조합의 설치 산출물이
      #   `lib/libantlr4-runtime.a` + `include/antlr4-runtime/` 임을 확인했습니다.
      - name: Build ANTLR4 C++ runtime
        if: steps.antlr-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          curl -fsSL -o /tmp/antlr4-cxx.zip \
            "https://www.antlr.org/download/antlr4-cpp-runtime-${ANTLR4_VERSION}-source.zip"
          rm -rf /tmp/antlr4-src
          unzip -q /tmp/antlr4-cxx.zip -d /tmp/antlr4-src
          cd /tmp/antlr4-src
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${ANTLR4_RUNTIME_ROOT}"
          cmake --build build --parallel "$(nproc)"
          cmake --install build

      - name: Verify ANTLR4 runtime layout
        run: |
          # configure 단계가 lib/libantlr4-runtime.a 와
          # include/antlr4-runtime/ 를 기대합니다. 먼저 확인해
          # 원인이 흐려진 CMake 오류를 막습니다.
          test -f "${ANTLR4_RUNTIME_ROOT}/lib/libantlr4-runtime.a" \
            || { echo "::error::libantlr4-runtime.a 없음"; ls -R "${ANTLR4_RUNTIME_ROOT}"; exit 1; }
          test -d "${ANTLR4_RUNTIME_ROOT}/include/antlr4-runtime" \
            || { echo "::error::include/antlr4-runtime 없음"; exit 1; }

      # ⚠️ 생성 소스가 커밋되어 있는지 먼저 확인합니다.
      #   없으면 CMake 가 FATAL_ERROR 로 멈추는데, 그 메시지만 보면
      #   "문법을 안 커밋했다" 를 알기 어렵습니다.
      - name: Verify committed ANTLR parsers
        run: |
          count=$(find SonarValidator_Prober/components/parser/generated/grammar \
            -name '*Parser.cpp' 2>/dev/null | wc -l)
          echo "커밋된 Parser.cpp: ${count}개"
          if [ "$count" -eq 0 ]; then
            echo "::error::생성된 ANTLR 파서가 커밋되어 있지 않습니다."
            echo "components/parser/cmake/regenerate_parser.sh 로 생성 후 커밋하세요."
            exit 1
          fi

      - name: Configure
        working-directory: SonarValidator_Prober
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DANTLR4_RUNTIME_ROOT="${ANTLR4_RUNTIME_ROOT}"

      - name: Build
        working-directory: SonarValidator_Prober
        run: cmake --build build --parallel "$(nproc)"

      - name: Run tests
        working-directory: SonarValidator_Prober
        run: ctest --test-dir build --output-on-failure

      - name: Test summary
        if: always()
        working-directory: SonarValidator_Prober
        run: |
          # LastTest.log 에서 결과 줄만 뽑습니다. 전체를 붙이면 로그가 묻힙니다.
          if [ -f build/Testing/Temporary/LastTest.log ]; then
            passed=$(grep -c '^ *[0-9]*/[0-9]* Test.*Passed' build/Testing/Temporary/LastTest.log || true)
            failed=$(grep -c '^ *[0-9]*/[0-9]* Test.*Failed' build/Testing/Temporary/LastTest.log || true)
            echo "### Prober 테스트 결과" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- 통과: **${passed}** / 실패: **${failed}**" >> "$GITHUB_STEP_SUMMARY"
          fi