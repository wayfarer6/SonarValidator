spring.application.name=SonarValidator_Backend

# Agent( C++ Prober )가 접속하는 포트.
# SonarValidator_Prober/Installer/default.conf 의 SERVER_PORT=3000 과 반드시 일치해야 합니다.
server.port=3000
debug=true

# WebSocket 프레임 크기는 여기서 설정하지 않습니다.
# spring.websocket.* 는 Spring Boot 에 존재하지 않는 프로퍼티이며 무시됩니다.
# Tomcat WebSocket 기본 버퍼는 8192 바이트라서, 그보다 큰 텔레메트리는
# close code 1009 로 거부됩니다. (프로버가 조용히 유실)
# 설정은 Config/WebSocketConfig 의 ServletServerContainerFactoryBean 에서 합니다.

# 로그에서 우리 코드 디버그를 보려면 DEBUG 로 변경
logging.level.org.sonar.sonarvalidator_backend=INFO

# ---------------------------------------------------------------------------
# 세션 (Spring Security 로그인)
# ---------------------------------------------------------------------------
# 로그인 세션 만료 시간입니다. 기본 30분은 운영에서 짧을 수 있어 8시간으로 둡니다.
# (근무 시간 동안 재로그인 없이 쓰도록)
server.servlet.session.timeout=8h
# 세션 쿠키를 HttpOnly 로 두어 JS 에서 읽지 못하게 합니다. (XSS 대비)
server.servlet.session.cookie.http-only=true
# SameSite=Lax: 크로스 사이트 폼 전송을 막으면서 최상위 네비게이션은 허용합니다.
# 프론트(5173)와 백엔드(3000)는 다른 포트이지만 <b>같은 사이트</b>(localhost)입니다.
server.servlet.session.cookie.same-site=lax

# ---------------------------------------------------------------------------
# CORS 허용 출처 (프론트 개발/배포 주소)
# ---------------------------------------------------------------------------
# 랩/배포마다 프론트 주소가 다를 수 있으므로 코드가 아니라 여기서 관리합니다.
# 여러 개면 쉼표로 구분합니다. (env: SONAR_CORS_ALLOWED_ORIGINS)
sonar.cors.allowed-origins=${SONAR_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173}

# ---------------------------------------------------------------------------
# 시크릿 암호화 키 (OPNsense API Secret 등)
# ---------------------------------------------------------------------------
# AES-256-GCM 에 쓸 32바이트를 Base64 로 인코딩한 값입니다.
#
#   openssl rand -base64 32
#
# 위 출력을 SONAR_SECRET_KEY 환경변수로 주입하거나 여기에 넣으세요.
#
# 주의: 값을 비우면 임시 키를 만들어 동작하지만, 서버를 재시작하면 기존에
#       저장한 Secret 을 복호화하지 못해 다시 입력해야 합니다.
sonar.secret.key=${SONAR_SECRET_KEY:}

# 기본 관리자 비밀번호입니다. 첫 기동 때만 쓰입니다(사용자가 없을 때).
# 운영 배포에서는 반드시 환경변수로 주입하세요.
sonar.admin.password=${SONAR_ADMIN_PASSWORD:admin}

# ---------------------------------------------------------------------------
# 사이트(랩) 환경 설정 — 하드코딩 제거
# ---------------------------------------------------------------------------
# 랩마다 달라지는 값을 코드가 아니라 여기서 관리합니다.
# (이전에는 격리 경고의 관리 대역, OVS 업링크/브리지, nftables 테이블 이름이
#  코드 상수나 기본값으로 박혀 있어 랩이나 제품을 바꿀 때 코드를 고쳐야 했습니다)
#
# ⚠️ management-prefix 는 제어평면(관리망) 대역입니다. 격리에서 **절대 차단
#    대상이 되어서는 안 됩니다** — 차단하면 해제 명령이 도달하지 못합니다.
#    프로젝트가 자기 값을 지정하면 그 값이 우선합니다 (요구사항).
sonar.site.management-prefix=${SONAR_MANAGEMENT_PREFIX:172.16.255.0/24}
#
# 스위치(OVS) 기본값 — 제품·배포마다 다릅니다.
sonar.site.switch.uplink-port=${SONAR_SWITCH_UPLINK_PORT:eth0}
sonar.site.switch.bridge-name=${SONAR_SWITCH_BRIDGE_NAME:br0}
# 폴백 선언에 쓰는 기본 포트 이름 (Arista="Ethernet 1", OVS="eth1").
sonar.site.switch.default-port=${SONAR_SWITCH_DEFAULT_PORT:Ethernet 1}
#
# 방화벽(nftables) 전용 테이블 이름 — 기본 filter 를 건드리지 않기 위함입니다.
sonar.site.firewall.table-name=${SONAR_FIREWALL_TABLE:sonar}
#
# 라우터 폴백 인터페이스 — 모델마다 다릅니다(GigabitEthernet0/0/1, Ethernet1, ge-0/0/0).
sonar.site.router.default-interface=${SONAR_ROUTER_DEFAULT_INTERFACE:GigabitEthernet0/0/1}
#
# VM 설정 백엔드 — 배포판·이미지마다 다릅니다(netplan, networkd, ifupdown).
# (VM 의 NIC 이름은 서버가 알 수 없어 Prober 가 __primary__ 를 실제 이름으로 치환합니다)
sonar.site.vm.config-backend=${SONAR_VM_CONFIG_BACKEND:netplan}

# 전역 기본 프로필: local (H2 파일 DB).
# PostgreSQL 서버가 없는 개발 환경에서도 바로 기동되도록 H2 를 기본으로 둡니다.
#
#   ./mvnw spring-boot:run                        -> local  (H2, 즉시 기동)
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#   java -jar app.jar --spring.profiles.active=postgres
#   SPRING_PROFILES_ACTIVE=postgres java -jar app.jar   (운영 배포 시 필수)
#
# DB 접속 설정은 프로필 파일에 있습니다.
#   - H2 (개발)   : src/main/resources/application-local.yml
#   - PostgreSQL  : src/main/resources/application-postgres.yml
#
# 주의: 운영 배포에서는 반드시 SPRING_PROFILES_ACTIVE=postgres 를 설정하세요.
#       설정을 빠뜨리면 H2 파일 DB 를 사용하게 됩니다.
spring.profiles.active=local
# Remote shell is disabled unless the same secret is configured for the backend and Agent.
sonar.terminal.shared-secret=${SONAR_TERMINAL_SHARED_SECRET:}

# -----------------------------------------------------------------------------
# OPNsense 접속 방식 (HTTP / HTTPS)
# -----------------------------------------------------------------------------
# 기본값은 둘 다 허용입니다. 랩 장비가 평문 HTTP 로 API 를 여는 경우
# (예: http://10.20.0.2)와 자체 서명 인증서를 쓰는 HTTPS 가 섞여 있기 때문입니다.
#
# ⚠️ Basic 인증 헤더(Base64)는 암호화가 아닙니다. 평문 HTTP 로 보내면 같은
#    링크의 누구나 API Key/Secret 을 읽을 수 있습니다. 운영 환경에서 평문 HTTP
#    를 막으려면 allow-http=false 로 끄고, 꼭 필요한 장비만 http-origins 에
#    나열하세요. (예: SONAR_OPNSENSE_HTTP_ORIGINS=http://10.20.0.2)
#    http-origins 가 비어 있으면 평문 HTTP 주소를 가리지 않습니다.
sonar.opnsense.allow-http=${SONAR_OPNSENSE_ALLOW_HTTP:true}
sonar.opnsense.http-origins=${SONAR_OPNSENSE_HTTP_ORIGINS:}
