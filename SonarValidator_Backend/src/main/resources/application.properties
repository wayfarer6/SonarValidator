spring.application.name=SonarValidator_Backend

# Agent( C++ Prober )가 접속하는 포트.
# SonarValidator_Prober/Installer/default.conf 의 SERVER_PORT=3000 과 반드시 일치해야 합니다.
server.port=3000

# WebSocket 프레임 크기는 여기서 설정하지 않습니다.
# spring.websocket.* 는 Spring Boot 에 존재하지 않는 프로퍼티이며 무시됩니다.
# Tomcat WebSocket 기본 버퍼는 8192 바이트라서, 그보다 큰 텔레메트리는
# close code 1009 로 거부됩니다. (프로버가 조용히 유실)
# 설정은 Config/WebSocketConfig 의 ServletServerContainerFactoryBean 에서 합니다.

# 로그에서 우리 코드 디버그를 보려면 DEBUG 로 변경
logging.level.org.sonar.sonarvalidator_backend=INFO

# 기본 프로필: local (H2 파일 DB).
# PostgreSQL 서버가 없는 개발 환경에서도 바로 기동되도록 H2 를 기본으로 둡니다.
#
#   ./mvnw spring-boot:run                        -> local  (H2, 즉시 기동)
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#   java -jar app.jar --spring.profiles.active=postgres
#   SPRING_PROFILES_ACTIVE=postgres java -jar app.jar   (운영 배포 시 필수)
#
# DB 접속 설정은 프로필 파일에 있습니다.
#   - H2 (개발)   : src/main/resources/application-local.yml
#   - PostgreSQL  : src/main/resources/application-postgres.yml
#
# 주의: 운영 배포에서는 반드시 SPRING_PROFILES_ACTIVE=postgres 를 설정하세요.
#       설정을 빠뜨리면 H2 파일 DB 를 사용하게 됩니다.
spring.profiles.active=local
