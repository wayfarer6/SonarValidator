# agent 생성시 서버측에서 ip, port 인증서 등을 지정함
#Node type은 Router, Switch, VM, Firewall 4가지만 존재 
# DATA_DIRECTORY는 Agent 만들때 벤더별로 경로 지정하기.
SERVER_IP=10.20.0.3;
SERVER_PORT=3000;
NODE_TYPE=Switch;
AGENT_NAME=Arista-Switch;
# 원격 터미널(WebSocket) 공통 비밀값. 백엔드의 SONAR_TERMINAL_SHARED_SECRET 과
# 정확히 같아야 합니다 — 다르면 터미널이 인증에서 거부됩니다.
TERMINAL_SHARED_SECRET=a300630c5f3502b7ee0384a3927c11d489ba46a0b93770334f7ea8392a9ed184;
# 제어평면(관리망) 대역. 격리(quarantine) 시 이 대역의 경로는 내리지 않습니다 —
# 내리면 해제 명령이 장치에 도달하지 못해 되돌릴 수 없게 됩니다.
# 이 랩의 관리망은 10.20.0.0/24 입니다. (기본값 172.16.255.0/24 는 다른 랩 기준)
MANAGEMENT_PREFIX=10.20.0.0/24;
