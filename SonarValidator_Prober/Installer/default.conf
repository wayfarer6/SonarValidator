# agent 생성시 서버측에서 ip, port 인증서 등을 지정함
#Node type은 Router, Switch, VM, Firewall 4가지만 존재 
# DATA_DIRECTORY는 Agent 만들때 벤더별로 경로 지정하기.
SERVER_IP=localhost;
SERVER_PORT=3000;
NODE_TYPE=VM;
DATA_DIRECTORY=;
# 제어평면(관리망) 대역입니다. 격리에서 절대 차단 대상이 되어서는 안 됩니다.
# 차단하면 서버로 나가는 길이 사라져 해제 명령조차 도달하지 못합니다.
# 여러 대역이면 쉼표로 구분합니다. (예: 172.16.255.0/24,10.0.0.0/24)
# 비워 두면 문서의 기본값(172.16.255.0/24)으로 폴백합니다.
MANAGEMENT_PREFIX=172.16.255.0/24;