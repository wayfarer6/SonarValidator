flush ruleset

table ip filter {
    chain input {
        type filter hook input priority 0; policy accept;
        
        # ACL 예시: 내부망(192.168.10.0/24)에서 오는 SSH(22)만 허용하고 나머지는 차단하려면 주석 해제
        # ip saddr 192.168.10.0/24 tcp dport 22 accept
        # tcp dport 22 drop
    }
    chain forward {
        type filter hook forward priority 0; policy accept;
        
        # ACL 예시: 내부망(eth1)에서 외부망(eth0)으로 가는 트래픽만 허용
        # iifname "eth1" oifname "eth0" accept
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        
        # SNAT (Masquerade) 규칙: 외부망(eth0)으로 나가는 트래픽의 출발지 IP를 라우터 IP로 변환
        oifname "eth0" masquerade
    }
}