# =============================================================================
# SonarValidator Frontend — nginx 설정
# =============================================================================
# 이 파일은 nginx 공식 이미지의 /etc/nginx/conf.d/default.conf 를 대체한다.
# conf.d/*.conf 는 nginx.conf 의 http 블록 안에서 include 되므로,
# 아래 map 은 http 컨텍스트 지시문으로 유효하다.

# -----------------------------------------------------------------------------
# WebSocket 업그레이드 판별
# -----------------------------------------------------------------------------
# Upgrade 헤더가 있으면 "upgrade", 없으면 "close" 를 Connection 헤더에 넣는다.
# 이렇게 해야 일반 REST 요청(Connection: close 유지)과
# WebSocket 핸드셰이크(Connection: upgrade)가 같은 location 을 쓸 수 있다.
# Agent(C++ Prober)는 /api/v1/management, /api/v1/telemetry 로 붙는다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 한글 파일명/본문이 깨지지 않게 한다. (Vite 산출물은 UTF-8)
    charset utf-8;

    # -------------------------------------------------------------------------
    # 업로드 크기
    # -------------------------------------------------------------------------
    # /api/v1/offline/import 로 설정 JSON 을 올린다. 랩 장치 17대 분량의
    # 스냅샷도 여유 있게 들어가도록 50MB 로 둔다.
    # (nginx 기본값은 1MB 라 큰 설정을 올리면 413 이 난다)
    client_max_body_size 50m;

    # -------------------------------------------------------------------------
    # gzip
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # API 리버스 프록시 → backend 컨테이너
    # -------------------------------------------------------------------------
    # "backend" 는 docker compose 의 서비스 이름이다. compose 가 만든
    # 네트워크에서 DNS 로 해석되므로 IP 를 하드코딩하지 않는다.
    #
    # ⚠️ 이 프록시 덕분에 프론트는 상대 경로(/api/v1/...)로 호출할 수 있고,
    #    브라우저 입장에서 프론트와 API 가 같은 출처가 된다.
    #    → CORS 불필요, 세션 쿠키(JSESSIONID)도 그대로 오간다.
    location /api/ {
        proxy_pass http://backend:3000;

        # WebSocket 을 쓰려면 HTTP/1.1 이어야 한다. (기본값 1.0)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 백엔드가 클라이언트 IP/호스트를 알 수 있게 전달한다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ⚠️ Agent 의 WebSocket 은 장수명 연결이다. 기본 proxy_read_timeout
        #    60초는 idle 시간이 60초를 넘으면 연결을 끊어버린다.
        #    텔레메트리 주기가 30초라 아슬아슬하므로 1시간으로 늘린다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # WebSocket 프레임을 즉시 전달해야 한다. 버퍼링하면 실시간성이 깨진다.
        proxy_buffering off;

        # 리다이렉트 Location 헤더의 backend:3000 을 외부 주소로 바꾼다.
        proxy_redirect off;
    }

    # -------------------------------------------------------------------------
    # Actuator (선택) — 같은 프록시를 태워 상태 확인
    # -------------------------------------------------------------------------
    location /actuator/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # 해시된 정적 자산 — 장기 캐시
    # -------------------------------------------------------------------------
    # Vite 는 파일명에 콘텐츠 해시를 넣으므로(index-abc123.js)
    # 내용이 바뀌면 파일명도 바뀐다. 그래서 1년 캐시가 안전하다.
    #
    # ⚠️ `expires` 와 `add_header Cache-Control` 을 같이 쓰면
    #    Cache-Control 헤더가 "두 개" 나간다. (expires 가 max-age 를 하나 만들고
    #    add_header 가 또 하나 붙인다) 브라우저는 둘 다 처리하지만 혼란스럽고
    #    중간 캐시가 다르게 해석할 수 있으므로 add_header 하나로 통일한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 폰트/이미지도 해시가 붙으므로 길게 캐시한다.
    location ~* \.(?:woff2?|ttf|otf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # ⚠️ index.html 은 절대 캐시하면 안 된다
    # -------------------------------------------------------------------------
    # 새 배포 후 index.html 이 캐시되어 있으면, 브라우저가 사라진 옛 자산
    # (예: index-oldhash.js) 을 계속 요청해 흰 화면이 된다.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # SPA fallback
    # -------------------------------------------------------------------------
    # React Router 는 /project/editor/123 같은 경로를 클라이언트에서 처리한다.
    # 실제 파일이 없으면 index.html 을 돌려준다.
    # (이게 없으면 새로고침 시 404 가 난다)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
